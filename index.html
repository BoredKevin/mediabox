<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Jam Digital - Cravion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://challenges.cloudflare.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        (function() {
            if (typeof window !== 'undefined') {
                var polyfillUUID = function() {
                    if (typeof window.crypto !== 'undefined' && typeof window.crypto.getRandomValues === 'function') {
                        try {
                            return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function(c) {
                                return (c ^ (window.crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16);
                            });
                        } catch (e) {}
                    }
                    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                        var r = (Math.random() * 16) | 0;
                        var v = c === 'x' ? r : (r & 0x3) | 0x8;
                        return v.toString(16);
                    });
                };

                try {
                    if (typeof Crypto !== 'undefined' && Crypto.prototype && !Crypto.prototype.randomUUID) {
                        Object.defineProperty(Crypto.prototype, 'randomUUID', {
                            value: polyfillUUID,
                            writable: true,
                            configurable: true,
                            enumerable: true
                        });
                    }
                } catch (e) {}

                try {
                    if (!window.crypto) {
                        Object.defineProperty(window, 'crypto', {
                            value: {},
                            writable: true,
                            configurable: true,
                            enumerable: true
                        });
                    }
                    if (window.crypto && !window.crypto.randomUUID) {
                        Object.defineProperty(window.crypto, 'randomUUID', {
                            value: polyfillUUID,
                            writable: true,
                            configurable: true,
                            enumerable: true
                        });
                    }
                } catch (e) {
                    try {
                        window.crypto.randomUUID = polyfillUUID;
                    } catch (e2) {}
                }
            }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
